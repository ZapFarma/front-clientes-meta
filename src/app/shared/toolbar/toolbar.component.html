<mat-toolbar>
  <button mat-icon-button [matMenuTriggerFor]="menu" class="example-icon" aria-label="Example icon-button with menu icon">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="logo"><img src="../../../assets/imgs/zapFarma-logo-fn.png"></span>
  <button mat-icon-button class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
    <a href="https://chat.zapfarma.com"><mat-icon>account_circle</mat-icon></a>
  </button>
</mat-toolbar>

<mat-menu #menu="matMenu">
  <button mat-menu-item>
    <mat-icon>help_outline</mat-icon>
    <span>Como funciona</span>
  </button>
  <button mat-menu-item>
    <a href="https://chat.zapfarma.com">
      <mat-icon>account_circle</mat-icon>
      <span>Área do cliente</span>
    </a>
  </button>
</mat-menu>
